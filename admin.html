<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة منبر حسان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --teal: #16a699;
            --burgundy: #5d1f3a;
            --dark: #1a3a4a;
            --cream: #f5f1e8;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--teal) 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--cream);
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--dark), var(--teal));
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            padding: 40px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab-btn:hover { color: var(--teal); }
        .tab-btn.active { color: var(--dark); border-bottom-color: var(--teal); }

        .section { display: none; }
        .section.active { display: block; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(22, 166, 153, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, var(--teal), var(--dark));
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(22, 166, 153, 0.3); }

        .btn-secondary {
            background: white;
            color: var(--teal);
            border: 2px solid var(--teal);
        }

        .btn-secondary:hover { background: var(--teal); color: white; }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.show { display: block; }
        .success { background: rgba(22, 166, 153, 0.1); color: var(--teal); border-left: 4px solid var(--teal); }
        .error { background: rgba(211, 47, 47, 0.1); color: #d32f2f; border-left: 4px solid #d32f2f; }

        .question-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--teal);
        }

        .question-item h3 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--teal) 0%, var(--dark) 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: var(--burgundy);
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .copy-btn:hover { background: #3d1028; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8em; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>لوحة إدارة منبر حسان</h1>
            <p>إدارة الاختبارات والنتائج</p>
        </div>

        <div class="content">
            <div class="message" id="successMsg"></div>
            <div class="message error" id="errorMsg"></div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard')">📊 لوحة التحكم</button>
                <button class="tab-btn" onclick="switchTab('create')">➕ إنشاء اختبار</button>
                <button class="tab-btn" onclick="switchTab('exams')">📋 الاختبارات</button>
                <button class="tab-btn" onclick="switchTab('results')">📈 النتائج</button>
            </div>

            <!-- Dashboard Tab -->
            <div id="dashboard" class="section active">
                <h2 style="color: var(--dark); margin-bottom: 30px;">📊 لوحة التحكم</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalExams">0</div>
                        <div>إجمالي الاختبارات</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalQuestions">0</div>
                        <div>إجمالي الأسئلة</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalResponses">0</div>
                        <div>الإجابات المرسلة</div>
                    </div>
                </div>

                <div style="margin-top: 30px; background: rgba(22, 166, 153, 0.05); padding: 20px; border-radius: 10px; border-right: 4px solid var(--teal);">
                    <h3 style="color: var(--dark); margin-bottom: 15px;">معلومات الاتصال</h3>
                    <div class="form-group">
                        <label>معرّف جدول البيانات:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="sheetId" value="1X0cwZ-owvZZAhftfu3tgpYJuiprsI82YsLv2UhKV1Ls" readonly />
                            <button class="copy-btn" onclick="copyToClipboard('sheetId')">📋 نسخ</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Create Tab -->
            <div id="create" class="section">
                <h2 style="color: var(--dark); margin-bottom: 30px;">➕ إنشاء اختبار جديد</h2>
                
                <form onsubmit="createExam(event)">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>اسم الاختبار:</label>
                            <input type="text" id="examName" required placeholder="مثال: اختبار الرياضيات الفصلي" />
                        </div>
                        <div class="form-group">
                            <label>المادة:</label>
                            <input type="text" id="subject" required placeholder="مثال: الرياضيات" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>الوصف:</label>
                        <textarea id="examDesc" placeholder="وصف الاختبار..."></textarea>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>عدد الأسئلة:</label>
                            <input type="number" id="questionCount" min="1" required placeholder="10" onchange="generateQuestionFields()" />
                        </div>
                        <div class="form-group">
                            <label>الوقت الإجمالي (دقيقة):</label>
                            <input type="number" id="totalTime" min="1" required placeholder="60" />
                        </div>
                    </div>

                    <div id="questionsContainer"></div>

                    <button type="submit" class="btn" style="width: 100%; padding: 15px; font-size: 1.1em; margin-top: 30px;">
                        ✅ إنشاء الاختبار
                    </button>
                </form>
            </div>

            <!-- Exams Tab -->
            <div id="exams" class="section">
                <h2 style="color: var(--dark); margin-bottom: 30px;">📋 الاختبارات المتاحة</h2>
                
                <div id="examsList"></div>
            </div>

            <!-- Results Tab -->
            <div id="results" class="section">
                <h2 style="color: var(--dark); margin-bottom: 30px;">📈 النتائج والإجابات</h2>
                
                <div class="form-group">
                    <label>اختر اختبار لعرض النتائج:</label>
                    <select id="resultsExamSelect" onchange="loadResults()">
                        <option value="">-- اختر اختبار --</option>
                    </select>
                </div>

                <div id="resultsList" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1X0cwZ-owvZZAhftfu3tgpYJuiprsI82YsLv2UhKV1Ls';
        const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL'; // سيتم تحديثه بعد النشر
        
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'exams') loadExams();
            if (tabName === 'results') loadResultsSelect();
            if (tabName === 'dashboard') loadDashboard();
        }

        function generateQuestionFields() {
            const count = parseInt(document.getElementById('questionCount').value) || 0;
            let html = '';
            
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="question-item">
                        <h3>❓ السؤال ${i + 1}</h3>
                        <div class="form-group">
                            <label>نص السؤال:</label>
                            <textarea class="q-text" placeholder="أدخل نص السؤال..."></textarea>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>نوع السؤال:</label>
                                <select class="q-type">
                                    <option value="mcq">خيارات متعددة</option>
                                    <option value="essay">مقالي</option>
                                    <option value="true-false">صحيح/خطأ</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>الوقت (دقيقة):</label>
                                <input type="number" class="q-time" value="1" min="1" />
                            </div>
                        </div>
                        <div class="q-options" style="display: none;">
                            <label>الخيارات (واحد في كل سطر):</label>
                            <textarea class="q-opts" placeholder="الخيار الأول&#10;الخيار الثاني&#10;الخيار الثالث"></textarea>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('questionsContainer').innerHTML = html;
            
            document.querySelectorAll('.q-type').forEach(select => {
                select.addEventListener('change', (e) => {
                    const optionsDiv = e.target.closest('.question-item').querySelector('.q-options');
                    optionsDiv.style.display = e.target.value === 'mcq' ? 'block' : 'none';
                });
            });
        }

        function createExam(e) {
            e.preventDefault();
            
            const examData = {
                name: document.getElementById('examName').value,
                subject: document.getElementById('subject').value,
                description: document.getElementById('examDesc').value,
                totalTime: document.getElementById('totalTime').value,
                questions: []
            };

            document.querySelectorAll('.question-item').forEach((item, i) => {
                const type = item.querySelector('.q-type').value;
                examData.questions.push({
                    number: i + 1,
                    text: item.querySelector('.q-text').value,
                    type: type,
                    time: item.querySelector('.q-time').value,
                    options: type === 'mcq' ? item.querySelector('.q-opts').value.split('\n').filter(o => o) : []
                });
            });

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'createExam',
                    data: examData
                })
            })
            .then(r => r.json())
            .then(result => {
                if (result.success) {
                    showMessage('successMsg', '✅ تم إنشاء الاختبار بنجاح! رابط الاختبار: ' + result.examLink);
                    document.querySelector('form').reset();
                    document.getElementById('questionsContainer').innerHTML = '';
                } else {
                    showMessage('errorMsg', '❌ خطأ: ' + result.message);
                }
            })
            .catch(e => showMessage('errorMsg', '❌ خطأ: ' + e.message));
        }

        function loadExams() {
            // سيتم تحميل من Google Sheets
            const examsList = document.getElementById('examsList');
            examsList.innerHTML = '<p style="text-align: center; color: #999;">جاري تحميل الاختبارات...</p>';
        }

        function loadDashboard() {
            // تحديث الإحصائيات
            document.getElementById('totalExams').textContent = '0';
            document.getElementById('totalQuestions').textContent = '0';
            document.getElementById('totalResponses').textContent = '0';
        }

        function loadResultsSelect() {
            const select = document.getElementById('resultsExamSelect');
            select.innerHTML = '<option value="">-- اختر اختبار --</option>';
        }

        function loadResults() {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '<p style="text-align: center; color: #999;">جاري تحميل النتائج...</p>';
        }

        function showMessage(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function copyToClipboard(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            alert('✓ تم النسخ!');
        }

        // تحميل البيانات عند فتح الصفحة
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
