<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حل الاختبار - منبر حسان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --teal: #16a699;
            --burgundy: #5d1f3a;
            --dark: #1a3a4a;
            --cream: #f5f1e8;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--teal) 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--cream);
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--dark), var(--teal));
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .content {
            padding: 40px;
        }

        .timer {
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            background: white;
            border: 3px solid var(--teal);
            border-radius: 10px;
            margin-bottom: 30px;
            color: var(--teal);
        }

        .timer.warning { border-color: #ff9800; color: #ff9800; }
        .timer.danger { border-color: #d32f2f; color: #d32f2f; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--teal), var(--dark));
            transition: width 0.3s;
        }

        .question-info {
            background: rgba(22, 166, 153, 0.1);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-right: 4px solid var(--teal);
        }

        .question-number {
            display: inline-block;
            background: var(--teal);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3em;
            color: var(--dark);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .option:hover {
            border-color: var(--teal);
            background: rgba(22, 166, 153, 0.05);
        }

        .option input {
            margin-left: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option.selected {
            border-color: var(--teal);
            background: rgba(22, 166, 153, 0.1);
        }

        .essay-answer {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            resize: vertical;
        }

        .essay-answer:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(22, 166, 153, 0.1);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--teal), var(--dark));
            color: white;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(22, 166, 153, 0.3); }

        .btn-secondary {
            background: white;
            color: var(--teal);
            border: 2px solid var(--teal);
        }

        .btn-secondary:hover { background: var(--teal); color: white; }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.show { display: block; }
        .error { background: rgba(211, 47, 47, 0.1); color: #d32f2f; border-left: 4px solid #d32f2f; }

        .loading, .finished {
            text-align: center;
            padding: 60px 20px;
        }

        .finished {
            background: linear-gradient(135deg, var(--teal) 0%, var(--dark) 100%);
            color: white;
            border-radius: 10px;
        }

        .finished h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .finished p {
            font-size: 1.2em;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.5em; }
            .content { padding: 20px; }
            .timer { font-size: 1.8em; }
            .question-text { font-size: 1.1em; }
            .buttons { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>اختبار برنامج منبر حسان</h1>
            <p>اجب عن الأسئلة بعناية</p>
        </div>

        <div class="content" id="mainContent">
            <div class="message error" id="errorMsg"></div>

            <!-- Loading State -->
            <div id="loadingState" class="loading">
                <h2 style="color: var(--teal);">⏳ جاري تحميل الاختبار...</h2>
            </div>

            <!-- Exam State -->
            <div id="examState" style="display: none;">
                <div class="timer" id="timer">00:00</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress" style="width: 0%"></div>
                </div>

                <div class="question-info">
                    <div class="question-number" id="qNumber">السؤال 1 من 10</div>
                    <div class="question-text" id="qText">نص السؤال</div>
                </div>

                <div id="answersSection"></div>

                <div class="buttons">
                    <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()" style="display: none;">⬅️ السؤال السابق</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion();">السؤال التالي ➡️</button>
                    <button class="btn btn-primary" id="submitBtn" style="display: none; background: linear-gradient(135deg, var(--burgundy), #3d1028); min-width: auto;" onclick="submitExam();">✅ إنهاء الاختبار</button>
                </div>
            </div>

            <!-- Finished State -->
            <div id="finishedState" style="display: none;">
                <div class="finished">
                    <h2>شكراً لك! ✅</h2>
                    <p>تم إرسال إجاباتك بنجاح</p>
                    <p style="margin-top: 20px; font-size: 1em; opacity: 0.9;">سيقوم المعلم بمراجعة إجاباتك وإرسال النتائج قريباً</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1X0cwZ-owvZZAhftfu3tgpYJuiprsI82YsLv2UhKV1Ls';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMsH6t4i4P-TPqJdaaFjV1o6UOqQHgh7ePMc07ah3H8jSz6E-EJ42p-4AR2B-sW0ib/exec';

        let examData = null;
        let currentQuestion = 0;
        let studentAnswers = [];
        let totalSeconds = 0;
        let timerInterval = null;

        function getExamId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('examId');
        }

        function loadExam() {
            const examId = getExamId();
            if (!examId) {
                showError('معرّف الاختبار غير موجود');
                return;
            }

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'getExam',
                    examId: examId
                })
            })
            .then(r => r.json())
            .then(result => {
                if (result.success) {
                    examData = result.data;
                    initExam();
                } else {
                    showError('الاختبار غير موجود');
                }
            })
            .catch(e => showError('خطأ: ' + e.message));
        }

        function initExam() {
            studentAnswers = new Array(examData.questions.length).fill(null);
            totalSeconds = examData.questions.reduce((sum, q) => sum + (q.time * 60), 0);

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('examState').style.display = 'block';

            startTimer();
            displayQuestion(0);
        }

        function startTimer() {
            let remaining = totalSeconds;

            timerInterval = setInterval(() => {
                remaining--;

                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                document.getElementById('timer').textContent = display;

                if (remaining <= 60) document.getElementById('timer').classList.add('warning');
                if (remaining <= 10) document.getElementById('timer').classList.add('danger');

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                }
            }, 1000);
        }

        function displayQuestion(index) {
            currentQuestion = index;
            const q = examData.questions[index];
            const progress = ((index + 1) / examData.questions.length) * 100;

            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('qNumber').textContent = `السؤال ${index + 1} من ${examData.questions.length}`;
            document.getElementById('qText').textContent = q.text;

            let answerHTML = '';

            if (q.type === 'mcq') {
                answerHTML = '<div class="options">';
                q.options.forEach((opt, i) => {
                    const isSelected = studentAnswers[index] === i;
                    answerHTML += `
                        <label class="option ${isSelected ? 'selected' : ''}">
                            <input type="radio" name="answer" value="${i}" 
                                ${isSelected ? 'checked' : ''} 
                                onchange="saveAnswer(${index}, ${i})">
                            <span style="flex: 1;">${opt}</span>
                        </label>
                    `;
                });
                answerHTML += '</div>';
            } else if (q.type === 'true-false') {
                answerHTML = '<div class="options">';
                ['صحيح', 'خطأ'].forEach((opt, i) => {
                    const isSelected = studentAnswers[index] === i;
                    answerHTML += `
                        <label class="option ${isSelected ? 'selected' : ''}">
                            <input type="radio" name="answer" value="${i}" 
                                ${isSelected ? 'checked' : ''} 
                                onchange="saveAnswer(${index}, ${i})">
                            <span style="flex: 1;">${opt}</span>
                        </label>
                    `;
                });
                answerHTML += '</div>';
            } else {
                const answer = studentAnswers[index] || '';
                answerHTML = `<textarea class="essay-answer" onchange="saveAnswer(${index}, this.value)" placeholder="اكتب إجابتك هنا...">${answer}</textarea>`;
            }

            document.getElementById('answersSection').innerHTML = answerHTML;

            document.getElementById('prevBtn').style.display = index === 0 ? 'none' : 'block';
            document.getElementById('nextBtn').style.display = index === examData.questions.length - 1 ? 'none' : 'block';
            document.getElementById('submitBtn').style.display = index === examData.questions.length - 1 ? 'block' : 'none';
        }

        function saveAnswer(index, answer) {
            studentAnswers[index] = answer;
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                displayQuestion(currentQuestion - 1);
            }
        }

        function nextQuestion() {
            if (currentQuestion < examData.questions.length - 1) {
                displayQuestion(currentQuestion + 1);
            }
        }

        function submitExam() {
            clearInterval(timerInterval);

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'submitAnswers',
                    examId: getExamId(),
                    studentName: 'طالب',
                    answers: studentAnswers
                })
            })
            .then(r => r.json())
            .then(result => {
                document.getElementById('examState').style.display = 'none';
                document.getElementById('finishedState').style.display = 'block';
            })
            .catch(e => showError('خطأ في الإرسال: ' + e.message));
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = '❌ ' + msg;
            el.classList.add('show');
        }

        window.addEventListener('load', loadExam);
    </script>
</body>
</html>
